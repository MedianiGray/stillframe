name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: stillframe-web
          path: dist/
          retention-days: 7

  desktop:
    name: Desktop shell (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: cargo check
        run: cargo check --manifest-path desktop/Cargo.toml
        # 首次会拉取 xcap / tauri，耗时较长；失败时看日志定位依赖版本
        continue-on-error: true

  android:
    name: Android shell (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p android/app/src/main/assets/www && cp -r dist/* android/app/src/main/assets/www/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        # 上游偶发下载 SDK 失败，不让它拖垮整条 CI；下面的 assembleDebug 才是判据
        continue-on-error: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gradle build
        working-directory: android
        run: gradle assembleDebug --no-daemon
        continue-on-error: true
