[package]
name = "stillframe-desktop"
version = "0.1.0"
description = "Stillframe desktop shell (Tauri 2) — native screen capture, pin-to-screen, global hotkeys"
authors = ["Stillframe contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stillframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
# 跨平台屏幕抓取（Windows / macOS / Linux）。若 crates.io 版本已更新，
# 只需同步调整此处的版本号与 list_windows 里 title()/id() 的返回值处理。
xcap = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
