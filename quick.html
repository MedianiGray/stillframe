<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stillframe 快捷浮窗</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #1b1e22;
        --line: #34383f;
        --paper: #eceff3;
        --muted: #8a929c;
        --amber: #e8c35c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
      }
      .bar {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 6px 8px;
        gap: 4px;
        background: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .grip {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        align-self: stretch;
        color: var(--muted);
        cursor: grab;
      }
      .grip:active {
        cursor: grabbing;
      }
      .grip span {
        width: 3px;
        height: 16px;
        margin-right: 2px;
        border-left: 1px solid #5a626d;
        border-right: 1px solid #5a626d;
      }
      .act {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        min-width: 52px;
        height: 44px;
        padding: 0 6px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--paper);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
      }
      .act:hover {
        background: #262a30;
        border-color: #3d434b;
      }
      .act:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 1px;
      }
      .act b {
        font-size: 15px;
        font-weight: 500;
        color: var(--amber);
      }
      .sep {
        width: 1px;
        height: 28px;
        margin: 0 2px;
        background: var(--line);
      }
      .close {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
      }
      .close:hover {
        background: #33262a;
        color: #ff9a9a;
      }
      .status {
        flex: 1;
        min-width: 0;
        padding-left: 6px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="grip" data-tauri-drag-region aria-label="拖动浮窗"><span></span></div>
      <button class="act" data-mode="snap" type="button"><b>⊕</b>截图</button>
      <button class="act" data-mode="scroll" type="button"><b>↧</b>长图</button>
      <button class="act" data-mode="record" type="button"><b>●</b>录屏</button>
      <button class="act" data-mode="ocr" type="button"><b>⿻</b>取字</button>
      <button class="act" data-mode="translate" type="button"><b>A</b>译屏</button>
      <div class="sep"></div>
      <button class="act" data-action="main" type="button"><b>▤</b>主窗</button>
      <div class="status" id="status">拖动左侧把手可移动</div>
      <button class="close" data-action="close" type="button" aria-label="收起浮窗">×</button>
    </div>

    <script type="module">
      const invoke = window.__TAURI_INTERNALS__?.invoke;
      const status = document.getElementById('status');

      async function act(mode) {
        if (!invoke) {
          status.textContent = '未检测到桌面壳';
          return;
        }
        status.textContent = '正在打开捕捉台…';
        try {
          await invoke('quick_action', { mode });
        } catch (error) {
          status.textContent = String(error);
        }
      }

      document.querySelectorAll('.act[data-mode]').forEach((button) => {
        button.addEventListener('click', () => act(button.dataset.mode));
      });

      document.querySelector('[data-action="main"]').addEventListener('click', async () => {
        try {
          await invoke('quick_main');
        } catch (error) {
          status.textContent = String(error);
        }
      });

      document.querySelector('[data-action="close"]').addEventListener('click', async () => {
        try {
          await invoke('close_quick');
        } catch (error) {
          status.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
